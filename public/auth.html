<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0b78ff"><title>UZ APPS — Hisob</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="/"><img src="/logo.svg" alt="UZ APPS"><b>UZ APPS</b></a><div id="userPanel" class="hidden"><h1>Hisobingiz</h1><p id="helloText"></p><a id="adminLink" class="primary-btn hidden" href="/admin">Admin panelni ochish</a><button id="logoutBtn" class="ghost-btn" style="width:100%;margin-top:10px">Chiqish</button><p class="auth-switch"><a href="/">← Katalogga qaytish</a></p></div><div id="authPanel"><h1 id="formTitle">Kirish</h1><p id="formNote">Hisob ixtiyoriy. Yuklab olish uchun login shart emas.</p><form id="authForm"><div class="field" id="nameField"><label>Ism</label><input id="name" autocomplete="name" minlength="2" maxlength="80" placeholder="Ismingiz"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="siz@example.com"></div><div class="field"><label>Parol</label><input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Kamida 8 belgi"></div><button class="primary-btn" id="submitBtn" type="submit">Kirish</button></form><p class="auth-switch" id="switchText"></p><p class="auth-switch"><a href="/">← Ro‘yxatdan o‘tmasdan katalogga qaytish</a></p></div><div id="errorBox" class="hidden" style="margin-top:12px;color:#e5484d;font-size:13px"></div></main><script>(()=>{const $=s=>document.querySelector(s),isRegister=location.pathname.includes('register');const form=$('#authForm'),nameField=$('#nameField'),title=$('#formTitle'),note=$('#formNote'),submit=$('#submitBtn'),switchText=$('#switchText'),error=$('#errorBox');function setup(){nameField.classList.toggle('hidden',!isRegister);title.textContent=isRegister?'Ro‘yxatdan o‘tish':'Kirish';submit.textContent=isRegister?'Hisob yaratish':'Kirish';$('#password').autocomplete=isRegister?'new-password':'current-password';switchText.innerHTML=isRegister?'Hisobingiz bormi? <a href="/login"><b>Kirish</b></a>':'Yangi foydalanuvchimisiz? <a href="/register"><b>Ro‘yxatdan o‘tish</b></a>';note.textContent=isRegister?'Hisob yaratish ixtiyoriy: sevimlilar va reyting uchun kerak.':'Hisob ixtiyoriy. Yuklab olish uchun login shart emas.'}async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Xatolik yuz berdi');return d}async function me(){try{const {user}=await api('/api/auth/me');if(user){$('#authPanel').classList.add('hidden');$('#userPanel').classList.remove('hidden');$('#helloText').textContent=`${user.name} · ${user.email}`;if(user.role==='admin')$('#adminLink').classList.remove('hidden')}}catch{}}form.addEventListener('submit',async e=>{e.preventDefault();error.classList.add('hidden');submit.disabled=true;try{const body={email:$('#email').value.trim(),password:$('#password').value};if(isRegister)body.name=$('#name').value.trim();const {user}=await api(isRegister?'/api/auth/register':'/api/auth/login',{method:'POST',body:JSON.stringify(body)});location.href=user.role==='admin'?'/admin':'/'}catch(e){error.textContent=e.message;error.classList.remove('hidden')}finally{submit.disabled=false}});$('#logoutBtn').addEventListener('click',async()=>{await api('/api/auth/logout',{method:'POST'}).catch(()=>{});location.href='/'});setup();me()})();</script></body></html>
